# Target DNS server (IPv4 or IPv6 address, not a hostname)
dns_rfc2136_server = {{ letsencrypt_rfc2136_dns_server }}
# Target DNS port
dns_rfc2136_port = {{ letsencrypt_rfc2136_dns_port }}
# TSIG key name
dns_rfc2136_name = {{ letsencrypt_rfc2136_name }}
# TSIG key secret
dns_rfc2136_secret = {{ letsencrypt_rfc2136_secret }}
# TSIG key algorithm
dns_rfc2136_algorithm = {{ letsencrypt_rfc2136_algo }}
# TSIG sign SOA query (optional, default: false)
dns_rfc2136_sign_query = false
